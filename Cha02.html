<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一建管理 · 交互刷题系统（第二轮 · Q41-80）</title>
<style>
  :root {
    --bg: #1a1d23;
    --card: #232830;
    --card-hover: #2a2f38;
    --border: #2e3440;
    --primary: #4a9eff;
    --primary-dark: #3a7ecc;
    --correct: #52c41a;
    --wrong: #ff4d4f;
    --warn: #faad14;
    --text: #e8eaf0;
    --text-light: #8b919a;
    --text-dim: #555b66;
    --tag-single: #4a9eff;
    --tag-multi: #a855f7;
    --progress-bg: #2a2f38;
    --dropdown-bg: #1e2228;
    --dropdown-item-hover: #2a2f38;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }

  /* ========== 顶部标题页 ========== */
  .top-bar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .top-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .course-info {
    flex: 1;
    min-width: 200px;
  }

  .course-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .course-sub {
    font-size: 12px;
    color: var(--text-light);
  }

  /* 进度条区域 */
  .progress-area {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 280px;
  }

  .score-display {
    font-size: 13px;
    color: var(--text-light);
    white-space: nowrap;
  }

  .score-display span {
    color: var(--primary);
    font-weight: 600;
    font-size: 16px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--progress-bg);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-dark), var(--primary));
    border-radius: 4px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* 选题下拉框 */
  .jump-area {
    position: relative;
  }

  .jump-btn {
    background: var(--dropdown-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    user-select: none;
    white-space: nowrap;
  }

  .jump-btn:hover {
    border-color: var(--primary);
    background: var(--card-hover);
  }

  .jump-btn .arrow {
    transition: transform 0.2s;
    font-size: 10px;
  }

  .jump-btn.open .arrow {
    transform: rotate(180deg);
  }

  .jump-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--dropdown-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    display: none;
    z-index: 200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    max-height: 380px;
    overflow-y: auto;
  }

  .jump-dropdown.show {
    display: grid;
    grid-template-columns: repeat(5, 38px);
    gap: 6px;
  }

  .jump-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 4px 0;
  }

  .jump-item {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    user-select: none;
  }

  .jump-item:hover {
    background: var(--dropdown-item-hover);
    border-color: var(--border);
  }

  .jump-item.done {
    background: rgba(82, 196, 26, 0.12);
    color: var(--correct);
    border-color: rgba(82, 196, 26, 0.3);
  }

  .jump-item.wrong {
    background: rgba(255, 77, 79, 0.12);
    color: var(--wrong);
    border-color: rgba(255, 77, 79, 0.3);
  }

  .jump-item.current {
    background: rgba(74, 158, 255, 0.15);
    color: var(--primary);
    border-color: rgba(74, 158, 255, 0.4);
    font-weight: 700;
  }

  .jump-item.todo {
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    border-color: var(--border);
  }

  /* ========== 主内容区 ========== */
  .main-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 16px 100px;
  }

  /* 做题页面 */
  .q-page {
    display: none;
  }

  .q-page.active {
    display: block;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 题目卡片 */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 16px;
  }

  .q-meta {
    display: flex;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .q-tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }

  .q-tag.single {
    background: rgba(74, 158, 255, 0.15);
    color: var(--tag-single);
  }

  .q-tag.multi {
    background: rgba(168, 85, 247, 0.15);
    color: var(--tag-multi);
  }

  .q-num {
    font-size: 12px;
    color: var(--text-dim);
  }

  .q-meta .q-confirm-btn {
    margin-left: auto;
    padding: 6px 18px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: #2a3a50;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .q-meta .q-confirm-btn:disabled {
    background: #2a3a50;
    color: var(--text-dim);
    cursor: not-allowed;
  }

  .q-meta .q-confirm-btn:not(:disabled) {
    background: linear-gradient(135deg, #4a9eff 0%, #6ac6ff 100%);
    color: #fff;
    box-shadow: 0 2px 12px rgba(74,158,255,0.35);
  }

  .q-meta .q-confirm-btn:not(:disabled):hover {
    background: linear-gradient(135deg, #3a7ecc 0%, #4a9eff 100%);
    box-shadow: 0 4px 16px rgba(74,158,255,0.50);
    transform: translateY(-1px);
  }

  .q-meta .q-nav-btn {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text-light);
  }

  .q-meta .q-nav-btn:hover {
    border-color: var(--text-light);
    color: var(--text);
  }

  .q-meta .q-nav-btn.hidden {
    visibility: hidden;
  }

  .q-text {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.8;
  }

  .q-hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  /* 候选项 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: flex-start;
    padding: 13px 15px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    background: rgba(255,255,255,0.02);
  }

  .opt:hover {
    border-color: var(--primary);
    background: rgba(74, 158, 255, 0.07);
  }

  .opt.selected {
    border-color: var(--primary);
    background: rgba(74, 158, 255, 0.12);
  }

  .opt.correct {
    border-color: var(--correct) !important;
    background: rgba(82, 196, 26, 0.12) !important;
  }

  .opt.wrong {
    border-color: var(--wrong) !important;
    background: rgba(255, 77, 79, 0.12) !important;
  }

  .opt.unselected-correct {
    border-color: var(--correct) !important;
    background: rgba(82, 196, 26, 0.12) !important;
  }

  .opt.letter {
    min-width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--progress-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    margin-right: 12px;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
    color: var(--text-light);
  }

  .opt-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
    flex: 1;
  }

  /* 得分条 */
  .score-bar {
    display: none;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
  }

  .score-bar.show {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }

  .score-bar.full {
    background: rgba(82, 196, 26, 0.15);
    color: var(--correct);
    border: 1px solid rgba(82, 196, 26, 0.3);
  }

  .score-bar.partial {
    background: rgba(250, 173, 20, 0.15);
    color: var(--warn);
    border: 1px solid rgba(250, 173, 20, 0.3);
  }

  .score-bar.wrong {
    background: rgba(255, 77, 79, 0.15);
    color: var(--wrong);
    border: 1px solid rgba(255, 77, 79, 0.3);
  }

  /* ========== 答案解析 ========== */
  .analysis {
    display: none;
    margin-top: 20px;
  }

  .analysis.show {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  .ans-section {
    background: #fafafa;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 14px;
    border-left: 4px solid var(--primary);
  }

  .ans-section h3 {
    font-size: 14px;
    color: #4a9eff;
    margin-bottom: 6px;
  }

  .ans-section .ca {
    font-size: 16px;
    font-weight: 700;
    color: var(--correct);
  }

  .opt-analysis {
    background: #fafafa;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    padding: 13px 15px;
    margin-bottom: 10px;
  }

  .opt-analysis h4 {
    font-size: 13px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .opt-analysis h4 .tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 600;
  }

  .tag-correct {
    background: #f6ffed;
    color: var(--correct);
    border: 1px solid #b7eb8f;
  }

  .tag-wrong {
    background: #fff2f0;
    color: var(--wrong);
    border: 1px solid #ffa39e;
  }

  .opt-analysis p {
    font-size: 13px;
    color: #555;
    line-height: 1.8;
  }

  .kb-section {
    background: #fff8e6;
    border-radius: 10px;
    padding: 16px 18px;
    margin-top: 14px;
    border-left: 4px solid var(--warn);
  }

  .kb-section h3 {
    font-size: 14px;
    color: #b7791f;
    margin-bottom: 10px;
  }

  .kb-section p, .kb-section li {
    font-size: 13px;
    color: #666;
    line-height: 1.8;
  }

  .kb-section ul {
    padding-left: 18px;
  }

  .kb-section li {
    margin-bottom: 4px;
  }

  .kb-section .page-ref {
    font-size: 12px;
    color: #999;
    background: #f5f5f5;
    padding: 2px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-top: 8px;
  }

  /* ========== 交卷汇总页 ========== */
  .summary-page {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }

  .summary-page.active {
    display: block;
    animation: fadeIn 0.4s ease;
  }

  .summary-icon {
    font-size: 56px;
    margin-bottom: 16px;
  }

  .summary-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  #summaryScore {
    font-size: 48px;
    font-weight: 800;
    color: var(--primary);
    margin: 12px 0;
  }

  #summaryScore .total {
    font-size: 20px;
    font-weight: 400;
    color: var(--text-light);
  }

  #summaryRounds {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  #summaryRoundTag {
    font-size: 12px;
    color: var(--warn);
    background: rgba(250, 173, 20, 0.12);
    border: 1px solid rgba(250, 173, 20, 0.3);
    border-radius: 20px;
    padding: 2px 12px;
    display: inline-block;
    margin-bottom: 12px;
  }

  .round-badge {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    color: var(--text-light);
  }

  .summary-msg {
    font-size: 14px;
    color: var(--text-light);
    margin-bottom: 28px;
  }

  .btn-redo {
    background: var(--card);
    color: var(--primary);
    border: 2px solid var(--primary);
    padding: 12px 32px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 30px;
    transition: all 0.2s;
  }

  .btn-redo:hover {
    background: rgba(74, 158, 255, 0.1);
  }

  .wrong-list-title {
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    padding: 0 4px;
  }

  .wrong-list {
    text-align: left;
  }

  .wrong-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .wrong-item:hover {
    border-color: var(--primary);
    background: var(--card-hover);
  }

  .wrong-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .wrong-item-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--wrong);
  }

  .wrong-item-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 4px;
    background: rgba(168, 85, 247, 0.15);
    color: var(--tag-multi);
  }

  .wrong-item-tag.single {
    background: rgba(74, 158, 255, 0.15);
    color: var(--tag-single);
  }

  .wrong-item-text {
    font-size: 13px;
    color: var(--text-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wrong-item-detail {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .wrong-item-detail.show {
    display: block;
  }

  .wrong-item-detail .q-text {
    font-size: 14px;
    margin-bottom: 10px;
  }

  .wrong-item-detail .options {
    gap: 8px;
  }

  .wrong-item-detail .opt {
    padding: 10px 12px;
  }

  .wrong-item-detail .opt-text {
    font-size: 13px;
  }

  .wrong-item-ans {
    margin-top: 12px;
    background: rgba(255,77,79,0.1);
    border: 1px solid rgba(255,77,79,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: left;
  }

  .wrong-item-ans p {
    font-size: 12px;
    color: var(--text-light);
    margin-bottom: 3px;
  }

  .wrong-item-ans .ca {
    color: var(--correct);
    font-weight: 700;
    font-size: 13px;
  }

  .no-wrong {
    color: var(--text-dim);
    font-size: 14px;
    padding: 30px 0;
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 480px) {
    .top-inner { flex-direction: column; align-items: flex-start; gap: 10px; }
    .progress-area { min-width: 100%; width: 100%; }
    .q-card { padding: 18px 16px; }
    .q-text { font-size: 15px; }
  }

  /* ========== 断点续做模态框 ========== */
  .resume-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .resume-modal.show { display: flex; }
  .resume-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .resume-box h2 { font-size: 20px; margin-bottom: 12px; color: var(--text); }
  .resume-box p { color: var(--text-light); font-size: 14px; margin-bottom: 8px; }
  .resume-stats {
    background: var(--bg);
    border-radius: 10px;
    padding: 16px;
    margin: 20px 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .resume-stat { text-align: center; }
  .resume-stat .num { font-size: 24px; font-weight: 700; color: var(--primary); }
  .resume-stat .label { font-size: 12px; color: var(--text-light); }
  .resume-btn-group { display: flex; gap: 12px; margin-top: 20px; }
  .resume-btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .resume-btn.primary {
    background: var(--primary);
    color: #fff;
  }
  .resume-btn.primary:hover { background: var(--primary-dark); }
  .resume-btn.secondary {
    background: var(--bg);
    color: var(--text-light);
    border: 1px solid var(--border);
  }
  .resume-btn.secondary:hover { border-color: var(--primary); color: var(--primary); }

  /* 顶部恢复进度按钮 */
  .top-resume-btn {
    background: linear-gradient(135deg, #52c41a, #389e0d);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .top-resume-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(82,196,26,0.3); }
  .top-resume-btn.show { display: flex; }
</style>
</head>
<body>

<!-- 顶部标题页 -->
<div class="top-bar">
  <div class="top-inner">
    <div class="course-info">
      <div class="course-name">2026 一建《项目管理》刷题系统</div>
      <div class="course-sub">第一章 · 工程项目投资管理与实施（第二轮 · Q41-80）</div>
    </div>
    <button class="top-resume-btn" id="topResumeBtn" onclick="showResumeModal()">
      恢复进度
    </button>
    <div class="progress-area">
      <div class="score-display">得分 <span id="scoreDisplay">0</span></div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="jump-area">
      <button class="jump-btn" id="jumpBtn" onclick="toggleJump()">
        <span>选题跳转</span>
        <span class="arrow">▼</span>
      </button>
      <div class="jump-dropdown" id="jumpDropdown"></div>
    </div>
  </div>
</div>

<!-- 断点续做模态框 -->
<div class="resume-modal" id="resumeModal">
  <div class="resume-box">
    <h2>发现未完成的进度</h2>
    <p>您上次练习到第 <strong id="resumeQNum">0</strong> 题</p>
    <div class="resume-stats">
      <div class="resume-stat">
        <div class="num" id="resumeDone">0</div>
        <div class="label">已完成</div>
      </div>
      <div class="resume-stat">
        <div class="num" id="resumeScore">0</div>
        <div class="label">当前得分</div>
      </div>
      <div class="resume-stat">
        <div class="num" id="resumeWrong">0</div>
        <div class="label">错题数</div>
      </div>
    </div>

const questions = QUESTIONS_40;

// ===================== 断点续做 =====================
const STORAGE_KEY = 'yijian_quiz_progress_v2';

function saveProgress() {
  const data = {
    submitted: submitted,
    userAnswers: userAnswers.map(a => a ? [...a] : null),
    totalScore: totalScore,
    wrongSet: [...wrongSet],
    currentQ: currentQ,
    everScored: everScored,
    savedAt: Date.now()
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) {
    console.warn('保存进度失败:', e);
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) {
    return null;
  }
}

function clearProgress() {
  localStorage.removeItem(STORAGE_KEY);
}

function showResumeModal() {
  const data = loadProgress();
  if (!data) return;

  const doneCount = data.submitted.filter(Boolean).length;
  document.getElementById('resumeQNum').textContent = data.currentQ + 1;
  document.getElementById('resumeDone').textContent = doneCount;
  document.getElementById('resumeScore').textContent = data.totalScore.toFixed(1);
  document.getElementById('resumeWrong').textContent = data.wrongSet.length;

  document.getElementById('resumeModal').classList.add('show');
}

function resumeProgress() {
  const data = loadProgress();
  if (!data) {
    startFresh();
    return;
  }

  submitted = data.submitted;
  userAnswers = data.userAnswers.map(a => a ? new Set(a) : null);
  totalScore = data.totalScore;
  wrongSet = new Set(data.wrongSet);
  currentQ = data.currentQ;
  everScored = data.everScored;

  document.getElementById('resumeModal').classList.remove('show');
  document.getElementById('topResumeBtn').classList.add('show');

  goToQuestion(currentQ);
  updateProgress();
  updateJumpDropdown();
}

function startFresh() {
  clearProgress();
  document.getElementById('resumeModal').classList.remove('show');

  totalScore = 0;
  submitted = new Array(N).fill(false);
  userAnswers = new Array(N).fill(null);
  everScored = new Array(N).fill(false);
  wrongSet = new Set();
  isRedoMode = false;

  renderAll();
  goToQuestion(0);
  updateProgress();
  updateJumpDropdown();
}

// ===================== 全局状态 =====================
const N = questions.length;
let totalPossible = questions.reduce((s, q) => s + (q.type === 'multi' ? 2 : 1), 0);
let totalScore = 0;
let currentQ = 0;
let submitted = new Array(N).fill(false);
let everScored = new Array(N).fill(false);
let userAnswers = new Array(N).fill(null);
let isRedoMode = false;
let wrongSet = new Set();
let lastRedoIdx = -1;
let roundScores = [];

function _onMainClick(e) {
  const optEl = e.target.closest('.opt');
  if (!optEl) return;
  const qIdx = parseInt(optEl.dataset.q, 10);
  const q = questions[qIdx];
  if (q.type === 'multi') {
    toggleMulti(optEl, qIdx);
  } else {
    selectSingle(optEl, qIdx);
  }
}

let _mainClickBound = false;

function renderAll() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  questions.forEach((q, idx) => {
    const page = document.createElement('div');
    page.className = 'q-page';
    page.id = `q-page-${idx}`;
    page.innerHTML = buildQuestionHTML(q, idx);
    main.appendChild(page);
  });

  if (!_mainClickBound) {
    main.addEventListener('click', _onMainClick);
    _mainClickBound = true;
  }

  const summary = document.createElement('div');
  summary.className = 'summary-page';
  summary.id = 'summaryPage';
  summary.innerHTML = buildSummaryHTML();
  main.appendChild(summary);

  renderJumpDropdown();
  updateJumpDropdown();
}

function buildQuestionHTML(q, idx) {
  const isMulti = q.type === 'multi';
  const tagClass = isMulti ? 'multi' : 'single';
  const tagText = isMulti ? '多选题' : '单选题';
  const optsHTML = q.opts.map(opt => `
    <div class="opt" data-key="${opt.key}" data-q="${idx}">
      <span class="letter">${opt.key}.</span>
      <span class="opt-text">${opt.text}</span>
    </div>
  `).join('');

  return `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-tag ${tagClass}">${tagText}</span>
        <span class="q-num">第 ${idx + 1} / ${N} 题</span>
        <button class="q-nav-btn q-prev-btn hidden" id="prevBtn-${idx}" onclick="goPrev(${idx})">上一题</button>
        <button class="q-nav-btn q-confirm-btn" id="confirmBtn-${idx}" disabled onclick="handleConfirm(${idx})">确定</button>
      </div>
      <div class="q-text">${q.text}</div>
      <div class="q-hint">${q.hint}</div>
      <div class="options" id="opts-${idx}">
        ${optsHTML}
      </div>
      <div class="score-bar" id="scoreBar-${idx}"></div>
      <div class="analysis" id="analysis-${idx}"></div>
    </div>
  `;
}

function buildSummaryHTML() {
  return `
    <div class="summary-icon">📋</div>
    <div class="summary-title">刷题完成</div>
    <div class="summary-score" id="summaryScore">0 <span class="total">/ ${totalPossible} 分</span></div>
    <div class="summary-round-tag" id="summaryRoundTag"></div>
    <div class="summary-rounds" id="summaryRounds"></div>
    <div class="summary-msg" id="summaryMsg"></div>
    <button class="btn-redo" id="btnRedo" onclick="startRedo()">错题重做</button>
    <div class="wrong-list-title">错题列表（共 <span id="wrongCount">0</span> 题）</div>
    <div class="wrong-list" id="wrongList"></div>
  `;
}

// ===================== 选择逻辑 =====================
function selectSingle(el, qIdx) {
  if (submitted[qIdx]) return;
  const container = document.getElementById(`opts-${qIdx}`);
  container.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  userAnswers[qIdx] = new Set([el.dataset.key]);
  syncNavBar();
}

function toggleMulti(el, qIdx) {
  if (submitted[qIdx]) return;
  if (!userAnswers[qIdx]) userAnswers[qIdx] = new Set();
  const key = el.dataset.key;
  if (userAnswers[qIdx].has(key)) {
    userAnswers[qIdx].delete(key);
    el.classList.remove('selected');
  } else {
    userAnswers[qIdx].add(key);
    el.classList.add('selected');
  }
  syncNavBar();
}

// ===================== 确定/下一题/交卷 =====================
function handleConfirm(qIdx) {
  if (!submitted[qIdx]) {
    submitAnswer(qIdx);
  } else {
    if (isRedoMode) {
      const wrongIndices = [...wrongSet].sort((a,b) => a-b);
      const curPos = wrongIndices.indexOf(qIdx);
      if (curPos < wrongIndices.length - 1) {
        goToQuestion(wrongIndices[curPos + 1]);
      } else {
        showSummary();
        isRedoMode = false;
      }
    } else {
      if (qIdx === N - 1) {
        showSummary();
      } else {
        goToQuestion(qIdx + 1);
      }
    }
  }
}

function submitAnswer(qIdx) {
  const q = questions[qIdx];
  const ua = userAnswers[qIdx];
  if (!ua || ua.size === 0) {
    alert('请至少选择一个选项');
    return;
  }

  submitted[qIdx] = true;
  const isMulti = q.type === 'multi';
  const correctSet = new Set(q.answer);

  let earned;
  if (isMulti) {
    const correctCount = [...ua].filter(k => correctSet.has(k)).length;
    const wrongCount = [...ua].filter(k => !correctSet.has(k)).length;
    if (wrongCount > 0) {
      earned = 0;
    } else if (correctCount === correctSet.size) {
      earned = 2;
    } else {
      earned = 0.5 * correctCount;
    }
  } else {
    earned = (ua.size === 1 && correctSet.has([...ua][0])) ? 1 : 0;
  }

  if (!everScored[qIdx]) {
    totalScore += earned;
    if (earned > 0) everScored[qIdx] = true;
  }

  const fullScore = isMulti ? 2 : 1;
  if (earned < fullScore) {
    wrongSet.add(qIdx);
  } else if (wrongSet.has(qIdx)) {
    wrongSet.delete(qIdx);
  }

  const container = document.getElementById(`opts-${qIdx}`);
  container.querySelectorAll('.opt').forEach(el => {
    const key = el.dataset.key;
    const isCorrect = correctSet.has(key);
    const isSelected = ua.has(key);
    el.classList.remove('selected');
    if (isCorrect && isSelected) {
      el.classList.add('correct');
    } else if (!isCorrect && isSelected) {
      el.classList.add('wrong');
    } else if (isCorrect && !isSelected) {
      el.classList.add('unselected-correct');
    }
  });

  const scoreBar = document.getElementById(`scoreBar-${qIdx}`);
  if (isMulti) {
    if (earned === 2) {
      scoreBar.className = 'score-bar show full';
      scoreBar.textContent = '🎉 完全正确！+2 分';
    } else if (earned > 0) {
      scoreBar.className = 'score-bar show partial';
      scoreBar.textContent = '⚠️ 部分正确！+' + earned + ' 分';
    } else {
      scoreBar.className = 'score-bar show wrong';
      scoreBar.textContent = '❌ 错误！+0 分';
    }
  } else {
    if (earned === 1) {
      scoreBar.className = 'score-bar show full';
      scoreBar.textContent = '✅ 回答正确！+1 分';
    } else {
      scoreBar.className = 'score-bar show wrong';
      scoreBar.textContent = '❌ 回答错误！+0 分';
    }
  }

  showAnalysis(qIdx, ua, earned);
  updateProgress();
  updateJumpDropdown();
  syncNavBar();
  saveProgress();
  document.getElementById('topResumeBtn').classList.add('show');
}

function showAnalysis(qIdx, ua, earned) {
  const q = questions[qIdx];
  const correctSet = new Set(q.answer);
  const uaArr = [...ua].sort();
  const caArr = [...correctSet].sort();

  const anaEl = document.getElementById(`analysis-${qIdx}`);
  const answerSet = new Set(q.answer);
  const optsHTML = q.analysis.opts_analysis.map(o => {
    const shouldSelect = answerSet.has(o.key);
    let tagClass, tagText;
    if (shouldSelect) {
      tagClass = 'tag-correct'; tagText = '✔ 符合题意';
    } else {
      tagClass = 'tag-wrong'; tagText = '✘ 不符合题意';
    }
    return `
      <div class="opt-analysis">
        <h4>选项 ${o.key} <span class="tag ${tagClass}">${tagText}</span></h4>
        <p>${o.analysis}</p>
      </div>
    `;
  }).join('');

  anaEl.innerHTML = `
    <div class="ans-section">
      <h3>✅ 正确答案</h3>
      <div class="ca">${q.analysis.correct_answer}</div>
      <p style="font-size:12px;color:#888;margin-top:4px;">你的答案：${uaArr.join('、')}</p>
    </div>
    ${optsHTML}
    <div class="kb-section">
      <h3>📖 知识点速览</h3>
      <p>${q.analysis.kb}</p>
      <span class="page-ref">📚 ${q.analysis.page_ref}</span>
    </div>
  `;
  anaEl.classList.add('show');
}

// ===================== 按钮同步 =====================
function syncNavBar() {
  const qIdx = currentQ;

  const prevBtn = document.getElementById(`prevBtn-${qIdx}`);
  if (prevBtn) {
    if (isRedoMode) {
      const wrongIndices = [...wrongSet].sort((a,b) => a-b);
      const curPos = wrongIndices.indexOf(qIdx);
      if (curPos <= 0) {
        prevBtn.classList.add('hidden');
      } else {
        prevBtn.classList.remove('hidden');
      }
    } else {
      if (qIdx === 0) prevBtn.classList.add('hidden');
      else prevBtn.classList.remove('hidden');
    }
  }

  const confirmBtn = document.getElementById(`confirmBtn-${qIdx}`);
  if (!confirmBtn) return;

  const isLast = isRedoMode ? (qIdx === lastRedoIdx) : (qIdx === N - 1);
  if (!submitted[qIdx]) {
    const hasAnswer = userAnswers[qIdx] && userAnswers[qIdx].size > 0;
    confirmBtn.disabled = !hasAnswer;
    confirmBtn.textContent = '确定';
  } else {
    confirmBtn.disabled = false;
    confirmBtn.textContent = isLast ? '查看成绩' : '下一题';
  }
}

// ===================== 恢复已提交题目的显示状态 =====================
function restoreQuestionState(qIdx) {
  const q = questions[qIdx];
  const ua = userAnswers[qIdx];
  if (!ua || !submitted[qIdx]) return;

  const isMulti = q.type === 'multi';
  const correctSet = new Set(q.answer);

  let earned;
  if (isMulti) {
    const correctCount = [...ua].filter(k => correctSet.has(k)).length;
    const wrongCount = [...ua].filter(k => !correctSet.has(k)).length;
    if (wrongCount > 0) earned = 0;
    else if (correctCount === correctSet.size) earned = 2;
    else earned = 0.5 * correctCount;
  } else {
    earned = (ua.size === 1 && correctSet.has([...ua][0])) ? 1 : 0;
  }

  const container = document.getElementById(`opts-${qIdx}`);
  container.querySelectorAll('.opt').forEach(el => {
    const key = el.dataset.key;
    const isCorrect = correctSet.has(key);
    const isSelected = ua.has(key);
    el.classList.remove('selected', 'correct', 'wrong', 'unselected-correct');
    if (isCorrect && isSelected) el.classList.add('correct');
    else if (!isCorrect && isSelected) el.classList.add('wrong');
    else if (isCorrect && !isSelected) el.classList.add('unselected-correct');
  });

  const scoreBar = document.getElementById(`scoreBar-${qIdx}`);
  if (isMulti) {
    if (earned === 2) { scoreBar.className = 'score-bar show full'; scoreBar.textContent = '🎉 完全正确！+2 分'; }
    else if (earned > 0) { scoreBar.className = 'score-bar show partial'; scoreBar.textContent = '⚠️ 部分正确！+' + earned + ' 分'; }
    else { scoreBar.className = 'score-bar show wrong'; scoreBar.textContent = '❌ 错误！+0 分'; }
  } else {
    if (earned === 1) { scoreBar.className = 'score-bar show full'; scoreBar.textContent = '✅ 回答正确！+1 分'; }
    else { scoreBar.className = 'score-bar show wrong'; scoreBar.textContent = '❌ 回答错误！+0 分'; }
  }

  showAnalysis(qIdx, ua, earned);
}

// ===================== 导航 =====================
function goToQuestion(idx) {
  document.querySelectorAll('.q-page').forEach(p => p.classList.remove('active'));
  document.getElementById('summaryPage').classList.remove('active');

  const target = document.getElementById(`q-page-${idx}`);
  target.classList.add('active');
  currentQ = idx;

  document.getElementById('summaryPage').style.display = 'none';
  document.getElementById('mainContent').querySelectorAll('.q-page').forEach(p => p.style.display = '');

  if (submitted[idx]) {
    restoreQuestionState(idx);
  }

  syncNavBar();
  updateJumpDropdown();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goPrev(idx) {
  if (isRedoMode) {
    const wrongIndices = [...wrongSet].sort((a,b) => a-b);
    const curPos = wrongIndices.indexOf(idx);
    if (curPos > 0) goToQuestion(wrongIndices[curPos - 1]);
  } else {
    if (idx > 0) goToQuestion(idx - 1);
  }
}

// ===================== 汇总页 =====================
function showSummary() {
  clearProgress();
  document.getElementById('topResumeBtn').classList.remove('show');

  document.querySelectorAll('.q-page').forEach(p => {
    p.classList.remove('active');
    p.style.display = 'none';
  });

  const sp = document.getElementById('summaryPage');
  sp.classList.add('active');
  sp.style.display = '';

  roundScores.push(totalScore);

  document.getElementById('summaryScore').innerHTML = totalScore + ' <span class="total">/ ' + totalPossible + ' 分</span>';

  const tagEl = document.getElementById('summaryRoundTag');
  if (isRedoMode) {
    tagEl.textContent = '错题重做';
    tagEl.style.display = 'inline-block';
  } else {
    tagEl.style.display = 'none';
  }

  const roundsEl = document.getElementById('summaryRounds');
  if (roundScores.length > 1) {
    const labels = ['第①轮', '第②轮', '第③轮', '第④轮', '第⑤轮'];
    roundsEl.innerHTML = roundScores.slice(0, -1).map((s, i) => {
      return '<div class="round-badge">' + (labels[i] || ('第' + (i+1) + '轮')) + '：' + s + '分</div>';
    }).join('');
  } else {
    roundsEl.innerHTML = '';
  }

  const pct = totalScore / totalPossible * 100;
  let msg = '';
  if (pct >= 100) msg = '🎉 太棒了！满分通关！';
  else if (pct >= 66) msg = '👍 表现不错，继续加油！';
  else msg = '📚 基础薄弱，建议重点复习教材！';
  document.getElementById('summaryMsg').textContent = msg;

  const wrongCount = wrongSet.size;
  document.getElementById('wrongCount').textContent = wrongCount;

  if (wrongCount === 0) {
    document.getElementById('wrongList').innerHTML = '<div class="no-wrong">🎉 太棒了！全部答对，无需重做！</div>';
    document.getElementById('btnRedo').textContent = '重新全量练习';
  } else {
    document.getElementById('btnRedo').textContent = '错题重做';
    const listEl = document.getElementById('wrongList');
    listEl.innerHTML = [...wrongSet].sort((a,b) => a-b).map(idx => {
      const q = questions[idx];
      const tagClass = q.type === 'multi' ? '' : 'single';
      const tagText = q.type === 'multi' ? '多选题' : '单选题';
      const optsHTML = q.opts.map(opt => {
        const isCorrect = new Set(q.answer).has(opt.key);
        const isSelected = userAnswers[idx] && userAnswers[idx].has(opt.key);
        let cls = 'opt';
        if (submitted[idx]) {
          if (isCorrect && isSelected) cls += ' correct';
          else if (!isCorrect && isSelected) cls += ' wrong';
          else if (isCorrect && !isSelected) cls += ' unselected-correct';
        }
        return '<div class="' + cls + '"><span class="letter">' + opt.key + '.</span><span class="opt-text">' + opt.text + '</span></div>';
      }).join('');

      return `
        <div class="wrong-item" id="wrong-item-${idx}" onclick="toggleWrongItem(${idx})">
          <div class="wrong-item-header">
            <span class="wrong-item-num">❌ 第 ${idx + 1} 题</span>
            <span class="wrong-item-tag ${tagClass}">${tagText}</span>
          </div>
          <div class="wrong-item-text">${q.text}</div>
          <div class="wrong-item-detail" id="wrong-detail-${idx}">
            <div class="q-text">${q.text}</div>
            <div class="options">${optsHTML}</div>
            <div class="wrong-item-ans">
              <p>正确答案：<span class="ca">${q.analysis.correct_answer}</span></p>
              <p>你的答案：${userAnswers[idx] ? [...userAnswers[idx]].sort().join('、') : '未作答'}</p>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleWrongItem(idx) {
  const detail = document.getElementById('wrong-detail-' + idx);
  detail.classList.toggle('show');
}

// ===================== 错题重做 =====================
function startRedo() {
  const wrongIndices = [...wrongSet].sort((a,b) => a-b);

  if (wrongIndices.length > 0) {
    isRedoMode = true;
    lastRedoIdx = wrongIndices[wrongIndices.length - 1];
    wrongIndices.forEach(idx => {
      submitted[idx] = false;
      userAnswers[idx] = null;
    });

    document.getElementById('summaryPage').classList.remove('active');
    document.getElementById('summaryPage').style.display = 'none';
    document.querySelectorAll('.q-page').forEach(p => {
      p.classList.remove('active');
      p.style.display = 'none';
    });

    questions.forEach((_, idx) => resetQuestionUI(idx));

    currentQ = wrongIndices[0];
    const target = document.getElementById('q-page-' + wrongIndices[0]);
    target.style.display = '';
    target.classList.add('active');
    syncNavBar();

    document.querySelectorAll('.wrong-item-detail').forEach(el => el.classList.remove('show'));

  } else {
    isRedoMode = false;
    totalScore = 0;
    submitted = new Array(N).fill(false);
    userAnswers = new Array(N).fill(null);
    everScored = new Array(N).fill(false);
    wrongSet = new Set();

    document.getElementById('summaryPage').classList.remove('active');
    document.getElementById('summaryPage').style.display = 'none';
    document.querySelectorAll('.q-page').forEach(p => {
      p.classList.remove('active');
      p.style.display = '';
    });

    questions.forEach((_, idx) => resetQuestionUI(idx));
    goToQuestion(0);
  }

  updateProgress();
  updateJumpDropdown();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetQuestionUI(idx) {
  const container = document.getElementById('opts-' + idx);
  container.querySelectorAll('.opt').forEach(el => {
    el.classList.remove('selected', 'correct', 'wrong', 'unselected-correct');
  });

  document.getElementById('scoreBar-' + idx).className = 'score-bar';
  document.getElementById('analysis-' + idx).classList.remove('show');
  document.getElementById('analysis-' + idx).innerHTML = '';
}

// ===================== 进度 & 下拉 =====================
function updateProgress() {
  const scoreEl = document.getElementById('scoreDisplay');
  const fillEl = document.getElementById('progressFill');

  scoreEl.textContent = totalScore.toFixed(1);

  const pct = Math.min(100, (totalScore / totalPossible) * 100);
  fillEl.style.width = pct + '%';
}

function renderJumpDropdown() {
  const dd = document.getElementById('jumpDropdown');
  dd.innerHTML = questions.map((q, idx) => {
    const cls = submitted[idx] ? (wrongSet.has(idx) ? 'wrong' : 'done') : 'todo';
    return '<div class="jump-item ' + cls + '" onclick="jumpTo(' + idx + ')">' + (idx + 1) + '</div>';
  }).join('');
}

function updateJumpDropdown() {
  const dd = document.getElementById('jumpDropdown');
  const items = dd.querySelectorAll('.jump-item');
  items.forEach((el, idx) => {
    el.classList.remove('current', 'done', 'wrong', 'todo');
    if (idx === currentQ) {
      el.classList.add('current');
    } else if (submitted[idx]) {
      el.classList.add(wrongSet.has(idx) ? 'wrong' : 'done');
    } else {
      el.classList.add('todo');
    }
  });
}

function toggleJump() {
  const btn = document.getElementById('jumpBtn');
  const dd = document.getElementById('jumpDropdown');
  btn.classList.toggle('open');
  dd.classList.toggle('show');
  updateJumpDropdown();
}

document.addEventListener('click', function(e) {
  const btn = document.getElementById('jumpBtn');
  const dd = document.getElementById('jumpDropdown');
  if (!btn.contains(e.target) && !dd.contains(e.target)) {
    btn.classList.remove('open');
    dd.classList.remove('show');
  }
});

function jumpTo(idx) {
  goToQuestion(idx);
  document.getElementById('jumpBtn').classList.remove('open');
  document.getElementById('jumpDropdown').classList.remove('show');
}

// ===================== 初始化 =====================
window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    _mainClickBound = false;
    const main = document.getElementById('mainContent');
    if (main) {
      main.removeEventListener('click', _onMainClick);
      main.addEventListener('click', _onMainClick);
      _mainClickBound = true;
    }
  }
});

renderAll();

const savedData = loadProgress();
if (savedData && savedData.submitted.some(Boolean)) {
  showResumeModal();
} else {
  goToQuestion(0);
}
</script>
</body>
</html>
